name: Build Overleaf Pro + TeX Live full

on:
  schedule:
    - cron: '0 6 * * *'   # daily check
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(gh api repos/ayaka-notes/ayakaleaf-pro/releases/latest --jq .tag_name | sed 's/^pro-v//')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/overleaf-pro-texlive-full" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already built
        id: check
        run: |
          if docker manifest inspect ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free runner disk space
        if: steps.check.outputs.exists == 'false'
        uses: jlumbroso/free-disk-space@main

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
